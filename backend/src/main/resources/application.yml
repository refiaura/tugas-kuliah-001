server:
  port: 8080

spring:
  application:
    name: pos-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_db?sslmode=disable
    username: pos
    password: pos
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate   # schema managed by Flyway
    show-sql: false
    properties:
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  # Override via env JWT_SECRET in real deployments. Default is DEV ONLY.
  secret: ${JWT_SECRET:dev-secret-key-min-32-bytes-long-for-local-dev-only-0123456789}
  access-expiration-ms: 900000      # 15 minutes
  refresh-expiration-ms: 604800000  # 7 days

logging:
  level:
    com.tugaskuliah.pos: INFO
    org.hibernate.SQL: WARN
